# Fichero plano para deploy/setup.sh. Argumento > fichero > defecto.
#
# El almacen remoto es la via normal cuando PROVISION_STORE=false: no se
# consulta ni se instala ningun runtime de contenedores. Con true, STORE_DSN
# debe apuntar a PostgreSQL local y el instalador provisiona pgvector.
INSTANCE_NAME=extended
STORE_DSN=postgresql://ianest:CAMBIAR@db.example.net:5432/ianest_extended
PROVISION_STORE=false

# Servicios de los que depende la capa. El backend de modelos no se provisiona.
CORE_URL=http://127.0.0.1:8000
EMBEDDINGS_ENDPOINT=http://127.0.0.1:11434
EMBEDDING_MODEL=bge-m3
EMBEDDING_DIMENSION=1024
EXTRACTION_MODEL=qwen_tech

# Interfaces sin autenticacion. Mantener loopback salvo red protegida.
REST_HOST=127.0.0.1
REST_PORT=8001
MCP_HOST=127.0.0.1
MCP_PORT=8091

# Instalar units y habilitarlas son decisiones distintas. VERIFY=strict exige
# servicios habilitados porque comprueba ambos puertos y la REST en ejecucion.
SERVICE_INSTALL=true
SERVICE_ENABLE=true
VERIFY=strict

# Ingesta reproducible antigua para un corpus: ruta a texto .txt/.md (fichero o
# directorio), nunca a vectores. CORPUS_DOMAINS es una lista separada por comas;
# sus vinculos se confirman tras ingerir. Dejar las cuatro claves vacias omite
# ingesta. CORPUS_MANIFEST es excluyente con la terna antigua y permite declarar
# N corpus; sus rutas relativas parten del directorio del manifiesto.
CORPUS_PATH=
CORPUS_NAME=
CORPUS_DOMAINS=
CORPUS_MANIFEST=

# Usuario que ejecuta los servicios y puede leer la configuracion. Vacio toma
# SUDO_USER o el usuario que lanza setup. Una config existente se preserva;
# REPLACE_CONFIG=true autoriza sustituirla por este fichero.
OPERATOR_USER=
REPLACE_CONFIG=false

# Ajustes adicionales del esquema de la capa pasan tal cual a extended.env.
# setup no valida sus valores: config.py los valida al arrancar. Solo se admiten
# claves IANEST_EXTENDED_* que setup no genere ya; una colision es error.
IANEST_EXTENDED_RAG_MIN_SCORE_DOMAIN=0.41
IANEST_EXTENDED_RAG_MIN_SCORE_NO_DOMAIN=0.46
