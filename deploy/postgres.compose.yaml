services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IANEST_EXTENDED_STORE_DATABASE}
      POSTGRES_USER: ${IANEST_EXTENDED_STORE_USER}
      POSTGRES_PASSWORD: ${IANEST_EXTENDED_STORE_PASSWORD}
    ports:
      - "127.0.0.1:${IANEST_EXTENDED_STORE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 45

volumes:
  postgres_data:
