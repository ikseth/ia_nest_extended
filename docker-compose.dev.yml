services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ianest_extended
      POSTGRES_USER: ianest
      POSTGRES_PASSWORD: ianest_local
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ianest -d ianest_extended"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ianest_extended_pgdata:/var/lib/postgresql/data

volumes:
  ianest_extended_pgdata:
